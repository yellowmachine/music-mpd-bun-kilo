name: Build and push images

on:
  push:
    # main publishes :latest (the old stack); bridge publishes :bridge for the
    # VPS + Pi stack while it is being tried out.
    branches: [main, bridge]
    paths:
      - '.github/workflows/docker-build.yml'
      - 'Dockerfile'
      - 'Dockerfile.mpd'
      - 'Dockerfile.snapserver'
      - 'Dockerfile.snapclient'
      - 'Dockerfile.piper'
      - 'Dockerfile.whisper'
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'bun.lock'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'mpd.conf'
      - 'entrypoint.sh'
      - 'whisper_server.py'
      - 'mpd-bridge/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Moving tag the composes follow; empty on other branches (sha tags only).
  CHANNEL: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref == 'refs/heads/bridge' && 'bridge' || '' }}
  SHA_SUFFIX: ${{ github.ref == 'refs/heads/bridge' && '-bridge' || '' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,suffix=${{ env.SHA_SUFFIX }}
            type=raw,value=${{ env.CHANNEL }},enable=${{ env.CHANNEL != '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=svelte-mpd
          cache-to: type=gha,mode=max,scope=svelte-mpd
          build-args: |
            PIPER_HOST=piper
            PIPER_PORT=5000
            PORT=3000

      # Redeploys the app on the VPS once its image is published. Set the
      # DOKPLOY_WEBHOOK_URL repository secret (the service's deploy webhook in
      # Dokploy) to enable it; without it this step does nothing.
      - name: Trigger Dokploy deploy
        if: env.CHANNEL != ''
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL not set, skipping deploy"
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST "$DOKPLOY_WEBHOOK_URL"

  build-and-push-sidecars:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: mpd
            dockerfile: Dockerfile.mpd
          - name: snapserver
            dockerfile: Dockerfile.snapserver
          - name: snapclient
            dockerfile: Dockerfile.snapclient
          - name: piper
            dockerfile: Dockerfile.piper
          - name: whisper
            dockerfile: Dockerfile.whisper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,suffix=${{ env.SHA_SUFFIX }}
            type=raw,value=${{ env.CHANNEL }},enable=${{ env.CHANNEL != '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  test-mpd-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mpd-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mpd-bridge/go.mod
          cache-dependency-path: mpd-bridge/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build-and-push-mpd-bridge:
    needs: test-mpd-bridge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mpd-bridge
          tags: |
            type=sha,prefix=sha-,suffix=${{ env.SHA_SUFFIX }}
            type=raw,value=${{ env.CHANNEL }},enable=${{ env.CHANNEL != '' }}

      # No QEMU: the Dockerfile cross-compiles on the runner's own platform.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: mpd-bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mpd-bridge
          cache-to: type=gha,mode=max,scope=mpd-bridge

  # Asks the bridge on the Pi (through the tunnel) to have Watchtower pull the
  # new image. Skipped with a notice when the secrets are not set.
  update-pi:
    needs: build-and-push-mpd-bridge
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/bridge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      BRIDGE_URL: ${{ secrets.MPD_BRIDGE_URL }}
      UPDATE_TOKEN: ${{ secrets.MPD_BRIDGE_UPDATE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$BRIDGE_URL" ] || [ -z "$UPDATE_TOKEN" ]; then
            echo "::notice::MPD_BRIDGE_URL or MPD_BRIDGE_UPDATE_TOKEN is not set; not notifying the bridge"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.secrets.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.secrets.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      # Notifying before GHCR propagates the tag would make Watchtower pull the
      # previous image, so wait until the channel tag resolves to our digest.
      - name: Wait for GHCR channel tag to reflect pushed digest
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mpd-bridge"
          target="${{ needs.build-and-push-mpd-bridge.outputs.digest }}"
          for i in $(seq 1 30); do
            current=$(docker buildx imagetools inspect "$image:$CHANNEL" 2>/dev/null \
              | awk '/^Digest:/ { print $2; exit }')
            if [ "$current" = "$target" ]; then
              echo "Matched after $i attempt(s): $current"
              exit 0
            fi
            echo "Attempt $i/30: $CHANNEL is '$current', want '$target' — retrying in 5s"
            sleep 5
          done
          echo "::error::Timed out waiting for $image:$CHANNEL to reflect $target"
          exit 1

      # 409 = Watchtower is already updating (e.g. its daily check); retry so
      # the update that runs sees the new image.
      - name: Trigger update through the bridge
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          for i in $(seq 1 6); do
            status=$(curl -sS -o /tmp/response.txt -w '%{http_code}' \
              -X POST "${BRIDGE_URL%/}/admin/update" \
              -H "Authorization: Bearer $UPDATE_TOKEN" \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
            echo "Attempt $i: HTTP $status $(cat /tmp/response.txt)"
            case "$status" in
              202) exit 0 ;;
              409) sleep 30 ;;
              *) echo "::error::The bridge answered HTTP $status"; exit 1 ;;
            esac
          done
          echo "::error::Watchtower is still busy after several attempts"
          exit 1
