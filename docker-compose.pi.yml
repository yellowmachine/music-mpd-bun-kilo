# Raspberry Pi stack once the web app runs on the VPS: audio services plus
# mpd-bridge, reached from the VPS only through a Cloudflare tunnel. cloudflared
# is managed outside this stack; point the tunnel at http://127.0.0.1:8787.
#
# Nothing here exposes MPD or Snapserver's control API. The bridge is published
# on loopback only, and the only port open to the LAN is Snapcast's audio
# stream (1704) for snapclients.
#
# Required in .env next to this file (template in .env.pi.example):
#   BRIDGE_API_TOKEN=<openssl rand -hex 32>   (same value as the app's MPD_BRIDGE_TOKEN)
#   BRIDGE_UPDATE_TOKEN=<openssl rand -hex 32> (a different one; the MPD_BRIDGE_UPDATE_TOKEN GitHub secret)
#   WATCHTOWER_TOKEN=<openssl rand -hex 32>    (only the bridge and watchtower use it, internally)
#
# Run: docker compose -f docker-compose.pi.yml up -d

services:
  mpd:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-mpd:bridge
    depends_on:
      - snapserver
    volumes:
      - /music:/var/lib/mpd/music:ro
      - ./playlists:/var/lib/mpd/playlists
      - ./mpd-db:/var/lib/mpd
      - shared-fifo:/shared
    restart: unless-stopped
    # No ports: only mpd-bridge talks to MPD, over the compose network. To use
    # a local client such as ncmpcpp on the Pi itself, publish it on loopback:
    # ports:
    #   - '127.0.0.1:6600:6600'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 6600 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  snapserver:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-snapserver:bridge
    volumes:
      - ./snapserver.conf:/etc/snapserver.conf
      - shared-fifo:/shared
    restart: unless-stopped
    ports:
      # Audio stream for snapclients on the LAN. The control API (1705) and
      # the HTTP/JSON-RPC UI (1780) have no auth and stay internal.
      - '1704:1704'

  snapclient:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-snapclient:bridge
    command: snapclient -h snapserver --hostID arriba -s Headphones
    depends_on:
      - snapserver
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ./asound.conf:/etc/asound.conf:ro

  mpd-bridge:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-mpd-bridge:bridge
    environment:
      MPD_HOST: mpd
      SNAP_HOST: snapserver
      LISTEN_ADDR: 0.0.0.0:8787
      API_TOKEN: ${BRIDGE_API_TOKEN:?set BRIDGE_API_TOKEN in .env}
      # POST /admin/update, called by CI after it publishes a new image.
      UPDATE_TOKEN: ${BRIDGE_UPDATE_TOKEN:?set BRIDGE_UPDATE_TOKEN in .env}
      WATCHTOWER_URL: http://watchtower:8080
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:?set WATCHTOWER_TOKEN in .env}
    # Loopback only: reachable by cloudflared on the Pi, not from the LAN.
    ports:
      - '127.0.0.1:8787:8787'
    labels:
      # Watchtower only updates containers with this label.
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      mpd:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  # Updates the bridge when it asks (the CI webhook) and, in case a webhook is
  # missed, once a day on its own. It is the only container with the Docker
  # socket, and it has no ports and no tunnel route: only the bridge reaches it.
  # This is the maintained fork of containrrr/watchtower (archived in 2025).
  watchtower:
    image: nickfedor/watchtower:1
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:?set WATCHTOWER_TOKEN in .env}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: 'true'
      WATCHTOWER_POLL_INTERVAL: '86400'
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_CLEANUP: 'true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  shared-fifo:
