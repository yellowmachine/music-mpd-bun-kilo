# VPS stack (deployed with Dokploy): the web app plus the services that
# don't need to be near the speakers. MPD and Snapcast stay on the Raspberry
# Pi (docker-compose.pi.yml) and are reached through mpd-bridge, behind a
# Cloudflare tunnel.
#
# Required variables (Dokploy: Environment tab; template in .env.vps.example):
#   DOMAIN=music.example.com          the domain set for svelte-mpd in Dokploy
#   ADMIN_PASSWORD=...
#   MPD_BRIDGE_URL=https://mpd-bridge.example.com
#   MPD_BRIDGE_TOKEN=...              same value as BRIDGE_API_TOKEN on the Pi
#   CF_ACCESS_CLIENT_ID=...           Cloudflare Access service token
#   CF_ACCESS_CLIENT_SECRET=...
# Optional: ANTHROPIC_API_KEY, ASSISTANT_TOKEN, OPENAI_API_KEY, AUDIO_URL_SECRET
#
# In Dokploy: create a Compose service from this file, set the variables
# above under Environment, and add the domain under Domains pointing at
# service svelte-mpd, port 3000. Dokploy's Traefik terminates HTTPS, so no
# port is published here.
#
# Piper (TTS) and Whisper (STT) are not run here: they overloaded the VPS.
# Without them, article audio and the voice assistant are unavailable.

services:
  svelte-mpd:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo:bridge
    # Redeploying pulls the newest image instead of reusing the cached :latest.
    pull_policy: always
    environment:
      NODE_ENV: production
      ORIGIN: https://${DOMAIN:?set DOMAIN}
      PORT: '3000'
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      MPD_BRIDGE_URL: ${MPD_BRIDGE_URL:?set MPD_BRIDGE_URL}
      MPD_BRIDGE_TOKEN: ${MPD_BRIDGE_TOKEN:?set MPD_BRIDGE_TOKEN}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET}
      # Signs article audio URLs that MPD on the Pi fetches from this app.
      # Falls back to a key derived from ADMIN_PASSWORD when unset.
      AUDIO_URL_SECRET: ${AUDIO_URL_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ASSISTANT_TOKEN: ${ASSISTANT_TOKEN:-}
    volumes:
      # Named volume: survives redeploys (Dokploy re-clones the repo, so a
      # ./ bind mount would not).
      - app-data:/app/data
    expose:
      - '3000'
    restart: unless-stopped

volumes:
  app-data:
