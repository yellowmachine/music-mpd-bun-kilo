services:
  mpd:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-mpd:latest
    depends_on:
      - snapserver
    volumes:
      - /music:/var/lib/mpd/music
      - ./playlists:/var/lib/mpd/playlists
      - ./mpd-db:/var/lib/mpd
      - shared-fifo:/shared
    restart: unless-stopped
    ports:
      - '6600:6600'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 6600 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  snapserver:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-snapserver:latest
    volumes:
      - ./snapserver.conf:/etc/snapserver.conf
      - shared-fifo:/shared
    restart: unless-stopped
    ports:
      - '1704:1704'
      - '1705:1705'
      - '1780:1780'

  snapclient:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-snapclient:latest
    command: snapclient -h snapserver --hostID arriba -s Headphones
    depends_on:
      - snapserver
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ./asound.conf:/etc/asound.conf:ro

  piper:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-piper:latest
    restart: unless-stopped

  whisper:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-whisper:latest
    restart: unless-stopped

  svelte-mpd:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo:latest
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    environment:
      NODE_ENV: production
      MPD_HOST: mpd
      MPD_PORT: '6600'
      SNAP_HOST: snapserver
      SNAP_PORT: '1780'
      PIPER_HOST: piper
      PIPER_PORT: '5000'
      ORIGIN: ${ORIGIN}
      PORT: '3000'
      WATCHTOWER_URL: http://watchtower:8080
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN}
      WHISPER_HOST: whisper
      WHISPER_PORT: '5001'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ASSISTANT_TOKEN: ${ASSISTANT_TOKEN}
    volumes:
      - ./podcasts-data:/app/data
    depends_on:
      mpd:
        condition: service_healthy
      snapserver:
        condition: service_started
      piper:
        condition: service_started
      whisper:
        condition: service_started
    restart: unless-stopped
    privileged: true
    ports:
      - '3000:3000'

  # Reverse proxy terminating HTTPS at https://musicpi.local with a
  # locally-issued cert (Caddy's own CA, persisted in the caddy-data volume).
  # Needed for browser APIs that require a secure context, like the
  # assistant's mic recording — plain http://<lan-ip>:3000 doesn't qualify.
  # Trust the CA once per device: copy /data/caddy/pki/authorities/local/root.crt
  # out of the caddy-data volume and install it as a trusted root.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - svelte-mpd
    ports:
      - '80:80'
      - '443:443'

  # Sidecar that applies updates on demand — triggered from the app's /admin
  # page via its HTTP API. Does NOT poll or auto-update on its own; it only
  # reacts to the authenticated request svelte-mpd sends.
  watchtower:
    # containrrr/watchtower is unmaintained and ships a Docker client too old
    # for recent Docker daemons ("client version 1.25 is too old"); use the
    # maintained fork instead.
    image: nickfedor/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_UPDATE: 'true'
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_CLEANUP: 'true'
    restart: unless-stopped

volumes:
  shared-fifo:
  caddy-data:
  caddy-config:
