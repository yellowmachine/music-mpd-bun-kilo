services:
  mpd:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-mpd:latest
    depends_on:
      - snapserver
    volumes:
      - /music:/var/lib/mpd/music
      - ./playlists:/var/lib/mpd/playlists
      - ./mpd-db:/var/lib/mpd
      - shared-fifo:/shared
    restart: unless-stopped
    ports:
      - '6600:6600'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 6600 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  snapserver:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-snapserver:latest
    volumes:
      - ./snapserver.conf:/etc/snapserver.conf
      - shared-fifo:/shared
    restart: unless-stopped
    ports:
      - '1704:1704'
      - '1705:1705'
      - '1780:1780'

  snapclient:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-snapclient:latest
    command: snapclient -h snapserver --hostID arriba -s Headphones
    depends_on:
      - snapserver
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ./asound.conf:/etc/asound.conf:ro

  piper:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-piper:latest
    restart: unless-stopped

  whisper:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-whisper:latest
    restart: unless-stopped

  mpd-bridge:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo-mpd-bridge:latest
    environment:
      MPD_HOST: mpd
      SNAP_HOST: snapserver
      LISTEN_ADDR: 0.0.0.0:8787
      API_TOKEN: ${BRIDGE_API_TOKEN:?set BRIDGE_API_TOKEN in .env (openssl rand -hex 32)}
    depends_on:
      mpd:
        condition: service_healthy
    restart: unless-stopped

  svelte-mpd:
    image: ghcr.io/yellowmachine/music-mpd-bun-kilo:latest
    environment:
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MPD_BRIDGE_URL: http://mpd-bridge:8787
      MPD_BRIDGE_TOKEN: ${BRIDGE_API_TOKEN}
      PIPER_HOST: piper
      PIPER_PORT: '5000'
      ORIGIN: ${ORIGIN}
      PORT: '3000'
      WHISPER_HOST: whisper
      WHISPER_PORT: '5001'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ASSISTANT_TOKEN: ${ASSISTANT_TOKEN}
    volumes:
      - ./podcasts-data:/app/data
    depends_on:
      mpd-bridge:
        condition: service_started
      piper:
        condition: service_started
      whisper:
        condition: service_started
    restart: unless-stopped
    ports:
      - '3000:3000'

  # Reverse proxy terminating HTTPS at https://musicpi.local with a
  # locally-issued cert (Caddy's own CA, persisted in the caddy-data volume).
  # Needed for browser APIs that require a secure context, like the
  # assistant's mic recording — plain http://<lan-ip>:3000 doesn't qualify.
  # Trust the CA once per device: copy /data/caddy/pki/authorities/local/root.crt
  # out of the caddy-data volume and install it as a trusted root.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - svelte-mpd
    ports:
      - '80:80'
      - '443:443'

volumes:
  shared-fifo:
  caddy-data:
  caddy-config:
